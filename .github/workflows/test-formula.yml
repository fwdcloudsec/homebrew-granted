name: Test Formula

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Install from source
        run: brew install --build-from-source fwdcloudsec/granted/granted

      - name: Verify granted version
        run: granted --version

      - name: Verify assumego symlink
        run: assumego --version

      - name: Verify shell scripts exist
        run: |
          test -f "$(brew --prefix)/bin/assume"
          test -f "$(brew --prefix)/bin/assume.fish"
          test -f "$(brew --prefix)/bin/assume.tcsh"
